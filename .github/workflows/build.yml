# 持续集成：推送到 master 或发起 PR 时构建，并上传 jar 构件
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 21（Gradle 守护进程运行时）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 与依赖缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建（编译用 Azul JDK 8 工具链由 foojay 自动拉取）
        run: ./gradlew build --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: advsolarpatch-jars
          path: build/libs/*.jar
          if-no-files-found: error
