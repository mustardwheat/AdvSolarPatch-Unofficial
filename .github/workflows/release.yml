# 自动发布：推送 v* 标签时构建并创建 GitHub Release
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 21（Gradle 守护进程运行时）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 与依赖缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建
        run: ./gradlew build --no-daemon

      # action-gh-release 的否定 glob 排除未生效（v1.3.0/v1.3.1 均带上了 dev jar），改为发布前物理移除
      - name: 移除 dev jar
        run: rm -f build/libs/*-dev.jar

      - name: 发布 Release（附重混淆主 jar，排除 dev jar）
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
