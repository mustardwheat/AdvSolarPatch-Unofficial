# Gradle 守护进程 JVM 参数（Minecraft 反编译过程需要较大内存）
org.gradle.jvmargs=-Xmx3G

# Mod 信息
mod_version=1.2.3
root_package=mods.su5ed
mod_id=advsolarpatch

# Coremod 插件类（jar manifest 的 FMLCorePlugin 与开发环境 -Dfml.coreMods.load 共用）
coremodPath=mods.su5ed.advsolarpatch.PatcherPlugin

# MCP 映射（RFG 默认即 1.12.2 + stable_39，此处显式固定）
mapping_channel=stable
mapping_version=39
