/**
 * AdvSolarPatch 构建脚本。
 * 工具链：RetroFuturaGradle（RFG）1.4.2 + Groovy DSL，结构参照 Super Solar Panels Unofficial 模板裁剪。
 */
plugins {
    id 'java'
    id 'idea'
    // RFG 1.4.1 已从 GTNH Maven 移除，1.4.2 是最接近的已发布补丁版本
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.2'
}

version = project.property('mod_version')
group = project.property('root_package')

base {
    archivesName.set(project.property('mod_id').toString())
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        // Azul 的 Java 8 工具链覆盖平台最全，由 foojay-resolver 自动下载
        vendor.set(JvmVendorSpec.AZUL)
    }
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set(project.property('mapping_channel').toString())
    mcpMappingVersion.set(project.property('mapping_version').toString())

    username.set('Developer')

    // 开发环境以 coremod 方式加载本插件（生产环境由 jar manifest 的 FMLCorePlugin 触发）
    extraRunJvmArguments.add('-Dfml.coreMods.load=' + project.property('coremodPath'))
}

repositories {
    // MixinBooter 仅发布在 CleanroomMC maven（本网络不可达）与 Modrinth maven，此处走 Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // IC2 与 ASP 的生产 jar（SRG 名），由 RFG 按当前映射反混淆；jar 固定在 libs/ 下，保证 CI 可复现
    implementation rfg.deobf(files('libs/industrialcraft-2-2.8.222-ex112.jar'))
    implementation rfg.deobf(files('libs/AdvancedSolarPanels-4.3.0.jar'))

    // Mixin 改由 MixinBooter（1.12.2 生态的事实标准前置，玩家环境普遍存在）提供，不再内嵌进产物 jar。
    // enableMixins 返回 MixinBooter 携带的 Mixin 编译期坐标，并负责开发环境的 MixinBooter 加载与 refmap 生成
    String mixin = modUtils.enableMixins('maven.modrinth:mixinbooter:10.2', 'mixins.advsolarpatch.refmap.json')
    api (mixin) {
        transitive = false
    }
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('advsolarpatch.info') {
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
}

jar {
    manifest {
        attributes(
                'Specification-Title': 'advsolarpatch',
                'Specification-Vendor': 'su5ed',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'su5ed',
                'Implementation-Timestamp': java.time.LocalDateTime.now().toString(),
                // 仍需 coremod 入口承载 ClassTransformer（InvSlot 构造器描述符改写无法以 Mixin 表达）；
                // Mixin 配置交由 MixinBooter 按 manifest 的 MixinConfigs 属性加载
                'FMLCorePlugin': project.property('coremodPath'),
                'MixinConfigs': 'mixins.advsolarpatch.json'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
